<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Iter — Aprende una vez. Usa cualquier biblioteca.</title>
  <desc id="desc">Portada técnica de Iter con una sintaxis centrada en la intención del usuario.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset="0.55" stop-color="#0b2036"/>
      <stop offset="1" stop-color="#0d2b34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74c0fc"/>
      <stop offset="1" stop-color="#8ce99a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1280" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="180" fill="#74c0fc" opacity="0.14" filter="url(#glow)"/>
  <circle cx="1120" cy="430" r="190" fill="#8ce99a" opacity="0.11" filter="url(#glow)"/>

  <g transform="translate(70 68)">
    <rect width="74" height="74" rx="20" fill="#102840" stroke="#74c0fc" stroke-width="2"/>
    <text x="37" y="51" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="800" fill="#f4f7fb">I</text>
    <text x="96" y="51" font-family="Inter,Segoe UI,sans-serif" font-size="46" font-weight="800" fill="#f4f7fb">Iter</text>

    <rect x="0" y="112" width="318" height="40" rx="20" fill="#132b45" stroke="#284b6d"/>
    <text x="159" y="138" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#b9dfff">Vista previa técnica · 0.3.0-rc.2</text>

    <text x="0" y="225" font-family="Inter,Segoe UI,sans-serif" font-size="58" font-weight="800" fill="#f4f7fb">Aprende una vez.</text>
    <text x="0" y="292" font-family="Inter,Segoe UI,sans-serif" font-size="58" font-weight="800" fill="url(#accent)">Usa cualquier biblioteca.</text>
    <text x="0" y="350" font-family="Inter,Segoe UI,sans-serif" font-size="23" fill="#a8b6ca">La intención primero. Iter resuelve el resto.</text>
    <text x="0" y="410" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#8ce99a">Everything is a Resource.</text>
  </g>

  <g transform="translate(790 112)">
    <rect width="430" height="300" rx="22" fill="#06111d" stroke="#28435f" stroke-width="2"/>
    <circle cx="25" cy="24" r="6" fill="#ff6b6b"/>
    <circle cx="45" cy="24" r="6" fill="#ffd43b"/>
    <circle cx="65" cy="24" r="6" fill="#69db7c"/>

    <text x="28" y="84" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#74c0fc">data</text>
    <text x="78" y="84" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#f4f7fb">= iter open</text>
    <text x="208" y="84" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#8ce99a">"data.json"</text>

    <text x="28" y="132" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#74c0fc">csv</text>
    <text x="68" y="132" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#f4f7fb">= iter convert data to</text>
    <text x="292" y="132" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#8ce99a">"csv"</text>

    <text x="28" y="180" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#f4f7fb">iter export csv as</text>
    <text x="230" y="180" font-family="SFMono-Regular,Consolas,monospace" font-size="19" fill="#8ce99a">"data.csv"</text>

    <line x1="28" y1="220" x2="400" y2="220" stroke="#203852"/>
    <text x="28" y="258" font-family="SFMono-Regular,Consolas,monospace" font-size="17" fill="#8ce99a">✓ no imports</text>
    <text x="182" y="258" font-family="SFMono-Regular,Consolas,monospace" font-size="17" fill="#8ce99a">✓ no boilerplate</text>
    <text x="28" y="284" font-family="SFMono-Regular,Consolas,monospace" font-size="16" fill="#73869b">one intent · one coherent experience</text>
  </g>
</svg>